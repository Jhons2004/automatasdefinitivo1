# project.properties — Propiedades del proyecto AutomatasAFD (NetBeans)
# Autor: Jonatan Abdiel Alvararado Villavicencio — Carné: 0910-22-8487
# Curso: Autómatas y Lenguajes Formales — VI Ciclo — Sección 3
annotation.processing.enabled=true
annotation.processing.enabled.in.editor=false
annotation.processing.run.all.processors=true
annotation.processing.source.output=${build.generated.sources.dir}/ap-source-output
application.title=AutomatasAFD
application.vendor=Jonatan Abdiel Alvararado Villavicencio
build.classes.dir=${build.dir}/classes
build.classes.excludes=**/*.java,**/*.form
build.dir=build
build.generated.dir=${build.dir}/generated
build.generated.sources.dir=${build.dir}/generated-sources
build.sysclasspath=ignore
build.test.classes.dir=${build.dir}/test/classes
build.test.results.dir=${build.dir}/test/results
build.test.tmp.dir=${build.dir}/test/tmp
debug.classpath=\
    ${run.classpath}
debug.test.classpath=\
    ${run.test.classpath}
# Los reportes en PDF se generan con un escritor propio incluido en el
# código (com.automatas.logica.GeneradorPDF), sin librerías externas:
# el proyecto compila y funciona solo con el JDK.
dist.archive.excludes=
dist.dir=dist
dist.jar=${dist.dir}/AutomatasAFD.jar
dist.javadoc.dir=${dist.dir}/javadoc
endorsed.classpath=
excludes=
includes=**
jar.compress=false
javac.classpath=
# Codificación de fuentes: UTF-8 (tildes y caracteres especiales).
javac.compilerargs=
javac.deprecation=false
javac.external.vm=true
javac.processorpath=
javac.source=17
javac.target=17
javac.test.classpath=\
    ${javac.classpath}:\
    ${build.classes.dir}:\
    ${libs.junit_4.classpath}:\
    ${libs.hamcrest.classpath}
javadoc.additionalparam=
javadoc.author=false
javadoc.encoding=${source.encoding}
javadoc.noindex=false
javadoc.nonavbar=false
javadoc.notree=false
javadoc.private=false
javadoc.splitindex=true
javadoc.use=true
javadoc.version=false
javadoc.windowtitle=
main.class=com.automatas.app.Main
manifest.file=manifest.mf
meta.inf.dir=${src.dir}/META-INF
mkdist.disabled=false
platform.active=JDK_17
run.classpath=\
    ${javac.classpath}:\
    ${build.classes.dir}
run.jvmargs=
run.test.classpath=\
    ${javac.test.classpath}:\
    ${build.test.classes.dir}
source.encoding=UTF-8
src.dir=src
test.src.dir=test
